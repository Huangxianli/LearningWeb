<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>将Props传递给组件</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>

  <body>
    <div id="root"></div>

    <script type="text/babel">
      /**
       * 可以将任何的 props 传递给自己的组件，props 是组件唯一的参数
       * 可以将 JSX 作为子组件传递
       *
       * 不要在组件内修改 props，必须由来源组件修改并传递一个新的 props（一个新的对象）
       *
       * props 的改变触发组件重新渲染本质上是对应父组件的 state 变化引起的，如果传入的 props 不是 state，那么该 props 的变化不会触发组件的重新渲染
       */
      function ChildComponent1({
        person = { name: 'name', age: 'age' },
        children,
        changeName = () => void 0,
      }) {
        return (
          <>
            <div>
              <span>name</span>
              <span>{person.name}</span>
            </div>
            <div>
              <span>age</span>
              <span>{person.age}</span>
            </div>
            <button onClick={changeName}>changeName</button>
            {children}
          </>
        );
      }
      function ChildComponent2() {
        return (
          <>
            <div>ChildComponent2</div>
          </>
        );
      }

      function RootComponent() {
        let person = {
          name: 'name1',
          age: 1,
        };
        const changeName = () => {
          person = { ...person, name: person.name + '1' };
        };

        return (
          <>
            <ChildComponent1 person={person} changeName={changeName}>
              <ChildComponent2 />
            </ChildComponent1>
          </>
        );
      }

      const container = document.getElementById('root');
      const root = ReactDOM.createRoot(container);
      root.render(<RootComponent />);
    </script>
  </body>
</html>
