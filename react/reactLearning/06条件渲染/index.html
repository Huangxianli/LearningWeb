<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>条件渲染</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>

  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;
      /**
       * 可以使用if 三目 && || 来进行条件渲染
       * 注意 && || 为 0 的时候
       */
      function ChildComponent1() {
        const showItem = true;
        const showJsx = showItem ? <div>show ChildComponent1</div> : null;
        return showJsx;
      }
      // 更推荐这种直接将逻辑写在 return 的内容里面
      function ChildComponent2() {
        const showItem = true;
        return <>{showItem && <div>show ChildComponent2</div>}</>;
      }

      // 和 vue3 的不同，state 的变化会重新执行整个函数组件，而不单单的是重新渲染
      function ChildComponent3() {
        const [showItem, setShowItem] = useState(true);
        const item = showItem ? <div>show ChildComponent3</div> : null;
        return (
          <>
            {item}
            <button onClick={() => setShowItem(!item)}>切换 item 显示</button>
          </>
        );
      }

      function RootComponent() {
        return (
          <>
            <ChildComponent1 />
            <ChildComponent2 />
            <ChildComponent3 />
          </>
        );
      }
      const container = document.getElementById('root');
      const root = ReactDOM.createRoot(container);
      root.render(<RootComponent />);
    </script>
  </body>
</html>
