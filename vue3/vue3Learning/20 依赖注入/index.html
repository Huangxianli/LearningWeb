<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>依赖注入</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>

  <body>
    <div id="app1"></div>
    <hr />
    <div id="app2"></div>
    <hr />
    <div id="app3"></div>

    <script>
      const { createApp, ref, provide, inject, watch, readonly } = Vue;

      /**
       * provide inject
       * 和响应式数据配合使用
       * 如果不是在 <sctipt setup> 中使用，要确保 provide() 是在 setup() 同步调用的
       * 默认值是 inject() 的第二个参数
       */
      const Component1 = {
        setup() {
          const clicks = inject('clicks');
          watch(
            clicks,
            (newValue, oldValue) => {
              console.log('clicks changed', oldValue, newValue);
            },
            {
              flush: 'pre',
            },
          );

          const unProvideInject1 = inject('data1', 'data1');
          console.log('unProvideInject1', unProvideInject1);

          // 使用工厂函数的返回值作为默认值，要将第三个参数设置为 true
          const unProvideInject2 = inject('data2', () => 12); // 这样设置，默认值是 () => 12
          console.log('unProvideInject2', unProvideInject2); // () => 12

          const unProvideInject3 = inject('data3', () => 12, true); // 这样设置，默认值是 12
          console.log('unProvideInject3', unProvideInject3); // 12
          return {
            clicks,
          };
        },
        template: `
          <div>根组件 provide 的 clicks {{clicks}}</div>
        `,
      };
      createApp({
        components: {
          Component1,
        },
        setup() {
          const clicks = ref(0);
          provide('clicks', clicks);
          const handleClick = () => {
            clicks.value += 1;
          };
          return {
            handleClick,
          };
        },
        template: `
          <button @click="handleClick">根组件修改 clicks</button>
          <Component1 />
        `,
      }).mount('#app1');

      /**
       * 应用层 Provide
       */
      const Component2 = {
        setup() {
          const rootProvide = inject('rootProvide');
          console.log('rootProvide', rootProvide);
          return {
            rootProvide,
          };
        },
        template: `
          <div>应用层 Provide {{rootProvide}}</div>
        `,
      };
      const app = createApp({
        components: {
          Component2,
        },
        setup() {},
        template: `
          <Component2 />
        `,
      });
      app.provide('rootProvide', 'rootProvide'); // 这样在所有的子孙组件里面都可以访问到
      app.mount('#app2');

      /**
       * vue 建议不要直接修改 inject 返回的内容
       * 正常的做法是提供该数据的来源在 provide 的时候，同时也将修改的方法一同提供过来，最好在 provide 的时候，就将数据用 readonly 包裹起来，而且为了防止 key 的冲突，最好在 provide 的时候，key 使用 Symbol 来定义
       */
      const countProvideKey = Symbol('countProvide');
      const setCountProvideKey = Symbol('setCountProvide');
      const Component3 = {
        setup() {
          const count = inject(countProvideKey, ref(0));
          const changeCount = () => {
            count.value++;
          };
          const setCount = inject(setCountProvideKey);
          const changeCount1 = () => {
            setCount();
          };
          return {
            count,
            changeCount,
            changeCount1,
          };
        },
        template: `
          <div>{{count}}</div>
          <button @click="changeCount">直接修改 count</button>
          <br />
          <button @click="changeCount1">通过来源修改 count</button>
        `,
      };
      createApp({
        components: {
          Component3,
        },
        setup() {
          const count = ref(0);
          provide(countProvideKey, readonly(count));
          const setCount = () => {
            count.value++;
          };
          provide(setCountProvideKey, setCount);
          return {
            count,
          };
        },
        template: `
          <div>来源处的 count：{{count}}</div>
          <Component3 />
        `,
      }).mount('#app3');
    </script>
  </body>
</html>
