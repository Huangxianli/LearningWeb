<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>模板语法</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>

  <body>
    <div id="app"></div>
    <hr />
    <div id="app1"></div>
    <hr />
    <div id="app2"></div>
    <hr />
    <div id="app3"></div>
    <script>
      /**
       * 模板语法：
       * 将组件实例的数据和 DOM 绑定
       * 模板 -> 编译成高度优化的 JS 代码（编译时会有优化）
       * 应用状态变更 -> 智能推断出最少需要渲染的部分，最少的 DOM 操作
       */

      const { createApp } = Vue;
      createApp({
        setup() {
          const message = 'template中的文本插值';
          return {
            message,
          };
        },
        template: `<div>{{message}}</div>`,
      }).mount('#app');

      createApp({
        setup() {
          const htmlData = '<div style="color: red">htmlData</div>';
          return {
            htmlData,
          };
        },
        template: '<div v-html="htmlData"></div>',
        // 如果是用户输入的内容，不要用 v-html。或者是先进行转义之后再使用 v-html
      }).mount('#app1');

      // Attribute 绑定
      createApp({
        setup() {
          return {
            id: 'idName',
          };
        },
        template: `<div :id>attribute绑定</div>`,
        // 这种同名简写语法只能在 Vue3.4 之后才能使用
      }).mount('#app2');

      createApp({
        setup() {
          return {
            bindObj: {
              attribute1: null,
              attribute2: 'attribute2',
            },
          };
        },
        template:
          '<div v-bind="bindObj">测试 attribute 的值为 null/undefined 以及其他的情况</div>',
      }).mount('#app3');
    </script>
  </body>
</html>
