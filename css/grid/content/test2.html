<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>外 flex + 内 grid，自动撑宽</title>
    <style>
      body {
        margin: 0;
        width: 100vw;
        display: flex;
      }
      .outer_box {
        border: 1px solid gray;
        display: grid;
        grid-template-columns: repeat(auto-fill, 200px);
        gap: 20px;
        max-width: calc(100%);
      }
      .bcr {
        background-color: red;
        height: 200px;
      }
    </style>
  </head>
  <body>
    <div class="outer_box">
      <div class="bcr">1</div>
      <div class="bcr">2</div>
      <div class="bcr">3</div>
      <div class="bcr">4</div>
      <div class="bcr">5</div>
      <div class="bcr">6</div>
      <div class="bcr">7</div>
      <div class="bcr">8</div>
      <div class="bcr">9</div>
      <div class="bcr">10</div>
      <div class="bcr">11</div>
      <div class="bcr">12</div>
      <div class="bcr">13</div>
      <div class="bcr">14</div>
    </div>
  </body>
</html>
